.d-wrap{max-width:1200px;margin:0 auto}
.d-card{background:#171717;border:1px solid #262626;border-radius:12px;padding:20px}
.d-muted{color:#8A8A8A}
.d-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid #2E2E2E;background:#1F1F1F;color:#EDEDED;font:600 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s}
.d-btn:hover{background:#262626;border-color:#3A3A3A}
.d-btn-primary{background:#EDEDED;color:#0A0A0A;border-color:#EDEDED}
.d-btn-primary:hover{background:#FFFFFF}
.d-btn[disabled]{opacity:.6;cursor:progress}
.d-input{height:40px;width:100%;padding:0 12px;border-radius:8px;border:1px solid #2E2E2E;background:#0F0F0F;color:#EDEDED;font:400 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.d-input:focus{outline:none;border-color:#6B6B6B}
.d-input[type=date]{color-scheme:dark;height:34px;width:auto;font-size:13px}
/* login */
.d-login{min-height:calc(100vh - 80px);display:grid;place-items:center}
.d-login .d-card{width:100%;max-width:360px;padding:28px}
.d-login h1{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.d-login p{margin:0 0 22px}
.d-login label{display:block;margin-bottom:14px;font-size:12px;color:#A3A3A3}
.d-login label span{display:block;margin-bottom:6px}
.d-login .d-btn{width:100%;height:40px;margin-top:6px}
.d-err{margin:10px 0 0;font-size:13px;color:#F29B8C}
/* topo */
.d-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.d-top h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.08em}
.d-top p{margin:2px 0 0}
.d-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.d-card{min-width:0}
.d-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.d-card-head h2{margin:0;font-size:14px;font-weight:600}
.d-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;color:#8A8A8A}
/* gráfico */
.d-chart{position:relative}
.d-chart svg{display:block;width:100%;height:auto}
.d-chart .axis{font:11px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#6B6B6B}
.d-tip{position:absolute;pointer-events:none;min-width:150px;padding:10px 12px;background:#0F0F0F;border:1px solid #2E2E2E;border-radius:8px;font-size:12px;line-height:1.6;opacity:0;transition:opacity .12s}
.d-tip b{display:block;margin-bottom:2px;font-weight:600}
.d-legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-size:12px;color:#A3A3A3}
.d-legend i{display:inline-block;width:14px;height:2px;margin-right:7px;vertical-align:middle;border-radius:2px}
.d-empty{padding:28px 0;text-align:center;color:#6B6B6B}
/* tabelas */
.d-table-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
.d-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.d-table th{padding:10px 12px 10px 0;text-align:left;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8A8A8A;border-bottom:1px solid #262626}
.d-table td{padding:12px 12px 12px 0;border-bottom:1px solid #1F1F1F}
.d-table tr:last-child td{border-bottom:0}
.d-table .num{text-align:right}
.d-wa{height:30px;padding:0 10px;font-size:11px}
.d-wa svg{width:14px;height:14px}
@media (max-width:600px){.d-top{flex-direction:column}.d-top .d-btn{align-self:flex-start}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></symbol>
</svg>
<div id="dash-app" aria-live="polite"></div>
<script>
/* ── Painel de leads ── */
(function(){
  var C=window.FACCIN_CONFIG||{}, SB=C.supabase||{}, DB=C.dashboard||{};
  var app=document.getElementById('dash-app'), KEY='fa_dash_session', TZ='America/Sao_Paulo';
  document.title='Leads | '+(DB.cliente||'Painel');
  function el(tag,attrs,text){var e=document.createElement(tag);if(attrs)for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e}
  function getS(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
  function setS(s){try{s?localStorage.setItem(KEY,JSON.stringify(s)):localStorage.removeItem(KEY)}catch(e){}}
  function auth(path,body){return fetch(SB.url+'/auth/v1/'+path,{method:'POST',headers:{'apikey':SB.anonKey,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
  function saveTok(j){var s={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};setS(s);return s}
  function token(){
    var s=getS(); if(!s)return Promise.reject({auth:true});
    if(s.expires_at-Date.now()/1000>60)return Promise.resolve(s.access_token);
    return auth('token?grant_type=refresh_token',{refresh_token:s.refresh_token}).then(function(j){return saveTok(j).access_token},function(){setS(null);throw {auth:true}});
  }
  function api(path,opts){
    opts=opts||{};
    return token().then(function(t){
      var h={'apikey':SB.anonKey,'Authorization':'Bearer '+t,'Content-Type':'application/json'};
      for(var k in (opts.headers||{}))h[k]=opts.headers[k];
      return fetch(SB.url+'/rest/v1/'+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
    }).then(function(r){if(r.status===401){setS(null);throw {auth:true}}if(!r.ok)throw {status:r.status};return r});
  }
  /* datas no fuso de São Paulo */
  function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date())}
  function addDays(d,n){var p=d.split('-').map(Number),t=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));return t.toISOString().slice(0,10)}
  function dm(d){return d.slice(8,10)+'/'+d.slice(5,7)}
  function fmtDate(iso){return new Date(iso).toLocaleString('pt-BR',{timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
  function digitsBR(w){var d=String(w||'').replace(/\D/g,'');if((d.length===10||d.length===11))d='55'+d;return d}
  function fmtPhone(w){var d=String(w||'').replace(/\D/g,'');if(d.length>11&&d.indexOf('55')===0)d=d.slice(2);if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return w||''}
  function lpName(s){return (DB.nomesLP&&DB.nomesLP[s])||s}
  function pct(l,v){return v?(l/v*100):0}
  function pctTxt(x){return x.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'}
  var WA='<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wa"/></svg>';

  /* ── Login ── */
  function showLogin(msg){
    app.innerHTML='<div class="d-login"><form class="d-card" novalidate><h1>Leads</h1><p class="d-muted"></p>'+
      '<label><span>Usuário</span><input class="d-input" name="u" autocomplete="username" required></label>'+
      '<label><span>Senha</span><input class="d-input" name="p" type="password" autocomplete="current-password" required></label>'+
      '<button class="d-btn d-btn-primary" type="submit">Entrar</button><p class="d-err" role="alert" hidden></p></form></div>';
    var f=app.querySelector('form'), err=f.querySelector('.d-err');
    f.querySelector('.d-muted').textContent=DB.cliente||'';
    if(msg){err.textContent=msg;err.hidden=false}
    f.u.focus();
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var u=f.u.value.trim(), p=f.p.value;
      if(!u||!p){err.textContent='Informe usuário e senha.';err.hidden=false;return}
      var email=u.indexOf('@')>-1?u:(u.toLowerCase()===String(DB.usuario||'admin').toLowerCase()?DB.email:null);
      if(!email){err.textContent='Usuário ou senha incorretos.';err.hidden=false;return}
      var b=f.querySelector('button');b.disabled=true;b.textContent='Entrando…';err.hidden=true;
      auth('token?grant_type=password',{email:email,password:p}).then(function(j){saveTok(j);showDash()},function(){
        b.disabled=false;b.textContent='Entrar';err.textContent='Usuário ou senha incorretos.';err.hidden=false;f.p.select();
      });
    });
  }

  /* ── Painel ── */
  var state={de:addDays(today(),-29),ate:today()};
  function showDash(){
    app.innerHTML='<div class="d-wrap">'+
      '<header class="d-top"><div><h1></h1><p class="d-muted" id="d-total">Carregando…</p></div><button class="d-btn" id="d-out" type="button">Sair</button></header>'+
      '<div class="d-grid">'+
        '<section class="d-card"><div class="d-card-head"><h2>Evolução diária</h2><div class="d-filter"><span>DE</span><input class="d-input" type="date" id="d-de"><span>ATÉ</span><input class="d-input" type="date" id="d-ate"></div></div>'+
          '<div class="d-chart" id="d-chart"><div class="d-empty">Carregando…</div></div>'+
          '<div class="d-legend"><span><i style="background:#EDEDED"></i>Visitas</span><span><i style="background:#C9A453"></i>Cadastros</span><span><i style="background:#22C55E"></i>Taxa de conversão (%)</span></div></section>'+
        '<div class="d-grid d-grid-2">'+
          '<section class="d-card"><div class="d-card-head"><h2>Conversão por LP</h2></div><div class="d-table-wrap"><table class="d-table"><thead><tr><th>LP</th><th class="num">Visitas</th><th class="num">Leads</th><th class="num">Conv.</th></tr></thead><tbody id="d-lps"></tbody></table></div></section>'+
          '<section class="d-card"><div class="d-card-head"><h2>Leads</h2><span class="d-muted" id="d-periodo"></span></div><div class="d-table-wrap"><table class="d-table"><thead><tr><th>Nome</th><th>WhatsApp</th><th>LP</th><th>Origem</th><th>Data</th><th>Ação</th></tr></thead><tbody id="d-leads"></tbody></table></div></section>'+
        '</div>'+
      '</div></div>';
    app.querySelector('h1').textContent='LEADS — '+String(DB.cliente||'').toUpperCase();
    var de=document.getElementById('d-de'), ate=document.getElementById('d-ate');
    de.value=state.de; ate.value=state.ate; de.max=ate.max=today();
    function onRange(){if(!de.value||!ate.value)return;if(de.value>ate.value){var t=de.value;de.value=ate.value;ate.value=t}state.de=de.value;state.ate=ate.value;load()}
    de.addEventListener('change',onRange); ate.addEventListener('change',onRange);
    document.getElementById('d-out').addEventListener('click',function(){
      var s=getS(); setS(null);
      if(s)fetch(SB.url+'/auth/v1/logout',{method:'POST',headers:{'apikey':SB.anonKey,'Authorization':'Bearer '+s.access_token}}).catch(function(){});
      showLogin();
    });
    load();
  }
  function fail(e){if(e&&e.auth){showLogin('Sessão expirada. Entre novamente.');return}
    var c=document.getElementById('d-chart');if(c)c.innerHTML='<div class="d-empty">Não foi possível carregar os dados. Verifique a conexão e atualize a página.</div>'}
  function emptyRow(tb,cols,msg){tb.textContent='';var tr=el('tr'),td=el('td',{colspan:cols,'class':'d-empty'},msg);tr.appendChild(td);tb.appendChild(tr)}

  function load(){
    var de=state.de, ate=state.ate;
    document.getElementById('d-periodo').textContent=dm(de)+' a '+dm(ate);
    /* total geral de leads */
    api('lp_leads?select=id',{headers:{'Prefer':'count=exact','Range':'0-0'}}).then(function(r){
      var n=Number((r.headers.get('content-range')||'').split('/')[1]||0);
      document.getElementById('d-total').textContent=n===1?'1 lead no total':n.toLocaleString('pt-BR')+' leads no total';
    }).catch(fail);
    /* série diária (janela ampliada 1 dia para cobrir o fuso; filtra no navegador) */
    api('rpc/lp_dashboard_daily',{method:'POST',body:{desde:addDays(de,-1),ate:addDays(ate,1)}}).then(function(r){return r.json()}).then(function(rows){
      var days=[],map={},bySite={};
      for(var d=de;d<=ate;d=addDays(d,1)){map[d]={dia:d,v:0,l:0};days.push(map[d])}
      rows.forEach(function(x){
        if(!map[x.dia])return;
        map[x.dia].v+=Number(x.visitas)||0; map[x.dia].l+=Number(x.cadastros)||0;
        var s=bySite[x.site]||(bySite[x.site]={v:0,l:0}); s.v+=Number(x.visitas)||0; s.l+=Number(x.cadastros)||0;
      });
      drawChart(days);
      var tb=document.getElementById('d-lps'); tb.textContent='';
      var sites=Object.keys(bySite).filter(function(k){return bySite[k].v||bySite[k].l});
      if(!sites.length){emptyRow(tb,4,'Nenhum dado encontrado');return}
      sites.sort(function(a,b){return bySite[b].l-bySite[a].l||bySite[b].v-bySite[a].v}).forEach(function(k){
        var s=bySite[k],tr=el('tr');
        tr.appendChild(el('td',null,lpName(k)));
        tr.appendChild(el('td',{'class':'num'},s.v.toLocaleString('pt-BR')));
        tr.appendChild(el('td',{'class':'num'},s.l.toLocaleString('pt-BR')));
        tr.appendChild(el('td',{'class':'num'},pctTxt(pct(s.l,s.v))));
        tb.appendChild(tr);
      });
    }).catch(fail);
    /* leads do período */
    var ini=encodeURIComponent(de+'T00:00:00-03:00'), fim=encodeURIComponent(addDays(ate,1)+'T00:00:00-03:00');
    api('lp_leads?select=id,nome,whatsapp,origem,site,created_at&created_at=gte.'+ini+'&created_at=lt.'+fim+'&order=created_at.desc&limit=1000').then(function(r){return r.json()}).then(function(leads){
      var tb=document.getElementById('d-leads'); tb.textContent='';
      if(!leads.length){emptyRow(tb,6,'Nenhum lead encontrado');return}
      leads.forEach(function(x){
        var tr=el('tr');
        tr.appendChild(el('td',null,x.nome||''));
        tr.appendChild(el('td',null,fmtPhone(x.whatsapp)));
        tr.appendChild(el('td',null,lpName(x.site)));
        tr.appendChild(el('td',null,x.origem||'—'));
        tr.appendChild(el('td',null,fmtDate(x.created_at)));
        var td=el('td'), num=digitsBR(x.whatsapp);
        if(num.length>=12){
          var msg='Olá, '+String(x.nome||'').trim()+'. Recebemos seu contato através da '+(DB.cliente||'')+' e gostaria de dar continuidade ao seu atendimento.';
          var a=el('a',{'class':'d-btn d-wa',href:'https://wa.me/'+num+'?text='+encodeURIComponent(msg),target:'_blank',rel:'noopener'});
          a.innerHTML=WA; a.appendChild(document.createTextNode('WhatsApp'));
          td.appendChild(a);
        }else{td.textContent='—'}
        tr.appendChild(td); tb.appendChild(tr);
      });
    }).catch(fail);
  }

  /* ── Gráfico (SVG, sem bibliotecas) ── */
  function nice(m){var st=Math.max(1,m/4),p=Math.pow(10,Math.floor(Math.log10(st))),n=st/p;var L=[1,1.2,1.5,2,2.5,3,4,5,6,8,10];for(var i=0;i<L.length;i++)if(n<=L[i]+1e-9){n=L[i];break}return n*p*4}
  var lastDays=null,rsz;
  addEventListener('resize',function(){clearTimeout(rsz);rsz=setTimeout(function(){if(lastDays&&document.getElementById('d-chart'))drawChart(lastDays)},150)});
  function drawChart(days){
    var box=document.getElementById('d-chart'); box.textContent='';
    var tv=0,tl=0; days.forEach(function(d){tv+=d.v;tl+=d.l});
    if(!tv&&!tl){box.appendChild(el('div',{'class':'d-empty'},'Nenhum dado encontrado'));return}
    lastDays=days;var W=Math.max(300,Math.round(box.clientWidth||900)),H=W<600?230:280,pl=38,pr=42,pt=14,pb=28,iw=W-pl-pr,ih=H-pt-pb,n=days.length;
    var mv=nice(Math.max.apply(null,days.map(function(d){return Math.max(d.v,d.l)}))||1);
    var mc=nice(Math.max.apply(null,days.map(function(d){return pct(d.l,d.v)}))||1);
    function x(i){return pl+(n===1?iw/2:iw*i/(n-1))}
    function yv(v){return pt+ih-ih*v/mv}
    function yc(c){return pt+ih-ih*c/mc}
    var ns='http://www.w3.org/2000/svg', svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('role','img'); svg.setAttribute('aria-label','Visitas, cadastros e taxa de conversão por dia');
    function add(tag,a,txt){var e=document.createElementNS(ns,tag);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e}
    for(var g=0;g<=4;g++){
      var gy=pt+ih*g/4;
      add('line',{x1:pl,x2:W-pr,y1:gy,y2:gy,stroke:'#262626','stroke-width':1});
      add('text',{x:pl-8,y:gy+4,'text-anchor':'end','class':'axis'},(mv*(4-g)/4).toLocaleString('pt-BR',{maximumFractionDigits:1}));
      add('text',{x:W-pr+8,y:gy+4,'class':'axis'},(mc*(4-g)/4).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%');
    }
    var step=Math.max(1,Math.ceil(n/(W<600?5:8)));
    days.forEach(function(d,i){if(i%step===0||(i===n-1&&(n-1)%step>=step/2))add('text',{x:x(i),y:H-8,'text-anchor':'middle','class':'axis'},dm(d.dia))});
    function path(f,color,dash){
      var dd=days.map(function(d,i){return (i?'L':'M')+x(i).toFixed(1)+' '+f(d).toFixed(1)}).join(' ');
      var a={d:dd,fill:'none',stroke:color,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}; if(dash)a['stroke-dasharray']='4 4';
      add('path',a);
      if(n<=45)days.forEach(function(d,i){add('circle',{cx:x(i),cy:f(d),r:2.5,fill:color})});
    }
    path(function(d){return yv(d.v)},'#EDEDED');
    path(function(d){return yv(d.l)},'#C9A453');
    path(function(d){return yc(pct(d.l,d.v))},'#22C55E',true);
    var guide=add('line',{x1:0,x2:0,y1:pt,y2:pt+ih,stroke:'#4A4A4A','stroke-width':1,opacity:0});
    var hit=add('rect',{x:pl,y:pt,width:iw,height:ih,fill:'transparent'});
    box.appendChild(svg);
    var tip=el('div',{'class':'d-tip'}); box.appendChild(tip);
    function move(ev){
      var r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)*W/r.width;
      var i=n===1?0:Math.round((px-pl)/iw*(n-1)); i=Math.max(0,Math.min(n-1,i));
      var d=days[i]; guide.setAttribute('x1',x(i)); guide.setAttribute('x2',x(i)); guide.setAttribute('opacity',1);
      tip.textContent=''; tip.appendChild(el('b',null,d.dia.split('-').reverse().join('/')));
      tip.appendChild(el('div',null,'Visitas: '+d.v.toLocaleString('pt-BR')));
      tip.appendChild(el('div',null,'Cadastros: '+d.l.toLocaleString('pt-BR')));
      tip.appendChild(el('div',null,'Conversão: '+pctTxt(pct(d.l,d.v))));
      var left=x(i)*r.width/W; tip.style.left=Math.min(Math.max(left-80,0),r.width-170)+'px'; tip.style.top='8px'; tip.style.opacity=1;
    }
    hit.addEventListener('mousemove',move); hit.addEventListener('touchstart',function(e){move(e.touches[0])},{passive:true});
    hit.addEventListener('mouseleave',function(){tip.style.opacity=0;guide.setAttribute('opacity',0)});
  }

  if(!SB.url||!SB.anonKey){app.innerHTML='<div class="d-login"><div class="d-card"><p class="d-err">Supabase não configurado neste arquivo.</p></div></div>';return}
  getS()?showDash():showLogin();
})();
</script>
