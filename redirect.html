  display:flex;align-items:center;justify-content:center;padding:calc(32px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(50% 50% at 50% 30%,rgba(200,160,74,.10),transparent 70%)}
main{width:100%;max-width:520px}
.brand{display:block;margin-bottom:56px}
.brand img{height:48px;width:auto}
h1{margin:0 0 14px;font:400 clamp(2.4rem,8vw,3.4rem)/1.05 var(--serif);letter-spacing:-.02em}
p{margin:0 0 28px;color:var(--light-2)}
.bar{height:1px;background:var(--line);margin:0 0 28px;overflow:hidden}
.bar span{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
.bar.run span{animation:fill var(--d,3000ms) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;border-radius:6px;background:#17894A;color:#fff;box-shadow:0 10px 30px -10px rgba(31,167,90,.45);font:600 1rem/1 var(--sans);text-decoration:none;transition:background-color .2s}
.btn:hover{background:#1FA75A}
.btn svg{width:20px;height:20px}
.small{font-size:.9rem;color:var(--stone);margin:18px 0 0}
.warn{border-left:1px solid var(--gold);padding-left:16px;color:var(--light-2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.bar.run span{animation:none;transform:scaleX(1)}}
</style>

<script>
(function(){
  var C=window.FACCIN_CONFIG||{};
  var raw=String(C.whatsappNumber||''), num=raw.replace(/\D/g,'');
  var ok=num.length>=12&&!/x/i.test(raw);
  var nome=''; try{nome=sessionStorage.getItem('fa_nome')||''}catch(e){}
  var text=nome&&C.whatsappMessage?C.whatsappMessage.replace('{nome}',nome)
          :(C.whatsappMessageSemNome||'Olá! Vim pelo site da Faccin Advocacia e gostaria de falar com o advogado.');
  var msg=document.getElementById('msg'), bar=document.getElementById('bar'), go=document.getElementById('go'), hint=document.getElementById('hint');

  if(!ok){
    msg.className='warn';
    msg.textContent='O número de WhatsApp do escritório ainda não foi configurado. Defina whatsappNumber no início do arquivo redirect.html para ativar o redirecionamento.';
    bar.hidden=true;
    return;
  }
  var url='https://wa.me/'+num+'?text='+encodeURIComponent(text);
  var delay=Number(C.redirectDelayMs)||3000;
  go.href=url; go.hidden=false; hint.hidden=false;
  bar.style.setProperty('--d',delay+'ms'); bar.classList.add('run');
  setTimeout(function(){location.replace(url)},delay);
})();
</script>
